<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle glow border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" />

  <!-- Academic Graduation Cap & Book Motif -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap Top (Rhombus) -->
    <polygon points="256,120 420,185 256,250 92,185" fill="#ffffff" />
    <polygon points="256,128 406,185 256,242 106,185" fill="#f8fafc" />

    <!-- Cap Skull Base -->
    <path d="M 160 216 L 160 278 C 160 326 352 326 352 278 L 352 216 C 322 236 288 246 256 246 C 224 246 190 236 160 216 Z" fill="#e2e8f0" />

    <!-- Tassel Button & Cord -->
    <circle cx="256" cy="185" r="14" fill="url(#goldGrad)" />
    <path d="M 256 185 Q 380 200 395 270" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <polygon points="390,265 408,268 402,330 384,330" fill="url(#goldGrad)" />
    <circle cx="393" cy="332" r="6" fill="#f59e0b" />

    <!-- Open Book Underneath -->
    <path d="M 120 370 Q 188 350 256 368 Q 324 350 392 370 L 392 410 Q 324 390 256 408 Q 188 390 120 410 Z" fill="#ffffff" />
    <path d="M 256 368 L 256 408" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" />

    <!-- Subtle Star / Sparkle Accent -->
    <path d="M 370 120 Q 370 135 385 135 Q 370 135 370 150 Q 370 135 355 135 Q 370 135 370 120 Z" fill="url(#goldGrad)" />
    <path d="M 130 290 Q 130 300 140 300 Q 130 300 130 310 Q 130 300 120 300 Q 130 300 130 290 Z" fill="url(#goldGrad)" />
  </g>
</svg>
